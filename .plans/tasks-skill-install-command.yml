tasks:
  - id: task-001
    title: "Refactor neo4j-cli tree builder into importable app package"
    description: |
      Move `NewCmd` and `Version` out of `neo4j-cli/main.go` (package main) into
      a new `neo4j-cli/app/app.go` (package app) so the per-binary skill
      generator can import the cobra tree. Shrink `main.go` to a thin
      entrypoint that calls `app.NewCmd`. Aura already exposes `NewCmd` /
      `NewStandaloneCmd` from `neo4j-cli/aura/aura.go` — no aura-side change.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "neo4j-cli/app/app.go exposes NewCmd(cfg *clicfg.Config) *cobra.Command and a Version package var"
      - "neo4j-cli/main.go reduced to entrypoint that wires afero, calls app.NewCmd, sets Help/error hooks"
      - "make build produces neo4j-cli with identical command surface (verified by --help output diff = empty)"
      - "make test passes; license header on the new file"
    completed_at: 2026-05-04T10:15:00Z

  - id: task-002
    title: "Implement common/skill/agents.go agent catalog and path expansion"
    description: |
      Port the agent catalog from LackOfMorals/go-cli-tool#9: the 10 supported
      agents (claude-code, cursor, windsurf, copilot, gemini-cli, cline,
      codex, pi, opencode, junie) with DetectDir / SkillsDir. Implement
      `expandPath` (~, ~/foo, $XDG_CONFIG_HOME with $HOME/.config fallback),
      `FindAgent` (case-insensitive lookup), and `DetectAgents(fs afero.Fs)`.
      Agent.DetectPath / SkillsPath return expanded paths and an ok bool.
      Add `agents_test.go` table-driven covering all REQ-T-002 cases with
      t.Setenv("HOME", ...) and afero.NewMemMapFs.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "common/skill/agents.go and agents_test.go committed with license headers"
      - "AGENTS slice matches the Rust reference verbatim"
      - "expandPath handles ~, bare ~, ~/foo, $XDG_CONFIG_HOME set/unset, missing HOME"
      - "FindAgent case-insensitive; unknown returns nil"
      - "DetectAgents takes afero.Fs and returns only agents whose DetectDir exists"
      - "go test ./common/skill/... passes; no real-disk reads in tests"
    completed_at: 2026-05-04T12:30:00Z

  - id: task-003
    title: "Implement common/skill/filesystem.go bundle copy/remove helpers"
    description: |
      Helpers that copy an embed.FS subtree onto an afero.Fs at a target
      directory and recursively remove a target directory. Used by
      Install/Remove. Use `fs.WalkDir` against the embed.FS, `filepath.Join`
      for destination paths, and `cfg.Aura.Fs()` (afero.Fs) for writes.
      Reuse `common/clicfg/fileutils/fileutils.go::WriteFile` for atomic
      writes.
    status: completed
    dependencies:
      - task-002
    acceptance_criteria:
      - "filesystem.go exposes CopyBundle(dst afero.Fs, dstDir string, bundle fs.FS) and RemoveDir(fs afero.Fs, dir string)"
      - "CopyBundle preserves bundle file structure (SKILL.md + references/*.md) under dstDir"
      - "RemoveDir is idempotent — returns nil when dir is missing"
      - "Uses filepath.Join (no string concatenation), forward slashes preserved in any markdown content untouched"
    completed_at: 2026-05-04T13:15:00Z

  - id: task-004
    title: "Implement common/skill/render package with golden-file tests"
    description: |
      `render.Bundle(root *cobra.Command, opts Options) (map[string][]byte, error)`
      walks the cobra tree and produces an in-memory bundle: SKILL.md
      (frontmatter + overview + global flags + subcommand index + gotchas) +
      one references/<sub>.md per top-level subcommand (recursive flags +
      examples, TOC if >100 lines). Always splits per top-level subcommand.
      Deterministic: sorted subcommands, sorted flag rows, hidden cmds
      excluded. Frontmatter `version` is the literal `{{VERSION}}` placeholder
      (substituted later by installer). Add render_test.go with a fixture
      cobra tree and golden files under render/testdata/.
    status: pending
    dependencies: []
    acceptance_criteria:
      - "render.Bundle returns deterministic byte-equal output for unchanged input"
      - "SKILL.md frontmatter includes name, description, version: {{VERSION}}"
      - "SKILL.md body includes Global Flags table and Subcommands index linking references/<sub>.md"
      - "References for subcommands >100 lines include a Contents TOC at the top"
      - "Hidden commands and the implicit `help` cmd are excluded"
      - "render_test.go uses a fixture tree + testdata/ golden files; byte-equal assertion"
      - "Coverage of render package ≥80%"
    completed_at: null

  - id: task-005
    title: "Implement common/skill/installer.go (Install/Remove/List/Check)"
    description: |
      Provides Install(ctx, fs, bundle, skillName, version, agentFilter),
      Remove(...), List(...), Check(...). Install: substitute {{VERSION}} →
      version in SKILL.md only (references unchanged), then copy to each
      target agent's <skillsDir>/<skillName>/. Without agentFilter: every
      detected agent (error if none); with agentFilter: case-insensitive
      single-agent lookup. Remove: idempotent removal. List: returns
      per-agent rows with Detected/Installed/InstalledVersion. Check:
      regex-parses the `version:` line in each installed SKILL.md and
      compares to the running binary version. Add table-driven
      installer_test.go covering all REQ-T-003 cases on afero.NewMemMapFs.
    status: pending
    dependencies:
      - task-002
      - task-003
    acceptance_criteria:
      - "All four operations work hermetically against afero.NewMemMapFs"
      - "{{VERSION}} substituted with runtime version on Install; references untouched"
      - "Install with no detected agents and no filter returns a typed error"
      - "Remove on uninstalled is a no-op (no error)"
      - "Check exits non-zero (returns drift) when installed version differs from runtime"
      - "Coverage of installer.go ≥80%"
    completed_at: null

  - id: task-006
    title: "Implement common/skill/command.go cobra wrapper + tests"
    description: |
      `NewCmd(cfg *clicfg.Config, bundle fs.FS, skillName string)
      *cobra.Command` returns a parent `skill` cobra command with
      install/remove/list/check leaves. Each leaf delegates to the installer
      and renders results as a table by default or JSON when --output json is
      passed (match existing CLI conventions in
      neo4j-cli/aura/internal/output). Optional positional [agent] on install
      and remove. Add command_test.go that execs each subcommand with
      captured stdout/stderr, asserting both table and JSON paths.
    status: pending
    dependencies:
      - task-005
    acceptance_criteria:
      - "skill install / remove / list / check are wired and call the installer"
      - "--output json emits the existing JSON envelope shape"
      - "Unknown agent on install/remove returns non-zero exit and a helpful error"
      - "command_test.go exercises both table and JSON paths for every subcommand"
    completed_at: null

